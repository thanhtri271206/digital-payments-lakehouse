[project]
name = "digital-payments-lakehouse"
version = "0.1.0"
description = "Digital Payments Monitoring and Automated Reconciliation Lakehouse"
readme = "README.md"
authors = [
    { name = "thanhtri271206", email = "thanhtri270106@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "confluent-kafka>=2.16.0",
    "faker>=40.43.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
digital-payments-lakehouse = "digital_payments_lakehouse:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "E402",   # module level import not at top of file (for pytest.importorskip)
    "BLE001", # blind exception catching
    "B905",   # zip without strict=
    "UP042",  # replace str, Enum with StrEnum
    "RUF001", # ambiguous unicode characters in strings
    "RUF002", # ambiguous unicode characters in docstrings
    "RUF003", # ambiguous unicode characters in comments
]
